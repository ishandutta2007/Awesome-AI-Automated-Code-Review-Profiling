<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Background Orbs / Waves (Dynamic Aspect) -->
  <g opacity="0.4">
    <circle cx="150" cy="100" r="180" fill="#38bdf8" opacity="0.15">
      <animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;140;100" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="300" r="220" fill="#c084fc" opacity="0.15">
      <animate attributeName="cx" values="1050;980;1050" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;250;300" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Tech / Data Flow Lines in Background -->
  <path d="M 50 320 Q 300 280 600 340 T 1150 300" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="15s" repeatCount="indefinite" />
  </path>
  <path d="M 50 80 Q 400 140 800 60 T 1150 100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25">
    <animate attributeName="stroke-dashoffset" values="0;100" dur="18s" repeatCount="indefinite" />
  </path>

  <!-- Foreground Content Container (Ensures text stays completely visible and clear) -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- Top Pill / Tag -->
    <g transform="translate(0, -100)">
      <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
      <text fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" y="5">AUTOMATED CODE REVIEW &amp; PROFILING</text>
    </g>

    <!-- Main Title -->
    <text y="-20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome AI Code Review 🤖
    </text>

    <!-- Subtitle Gradient Text -->
    <text y="35" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0.5">
      Static Analysis • SAST Security • AI Agents • Kernel Profilers
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 95)">
      <!-- Badge 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" y="4">⚡ AI PR Reviewers</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
        <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" y="4">🛡️ SAST &amp; Security</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
        <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" y="4">🔥 eBPF Profilers</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(240, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" />
        <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" y="4">🌐 100% Curated</text>
      </g>
    </g>
  </g>
</svg>
